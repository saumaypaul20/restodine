version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restodine_postgres
    restart: always
    environment:
      POSTGRES_USER: restodine_user
      POSTGRES_PASSWORD: restodine_password
      POSTGRES_DB: restodine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: restodine_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restodine_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://restodine_user:restodine_password@postgres:5432/restodine_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: your-super-secret-jwt-key
      STORAGE_PROVIDER: local
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
